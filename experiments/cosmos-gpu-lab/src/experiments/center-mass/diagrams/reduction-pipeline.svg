<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Center-of-mass reduction pipelines</title>
  <desc id="desc">The WebGL path blends every point into a one pixel texture. The WebGPU path reduces points into partial sums and then one result.</desc>
  <style>
    text { fill: #e2e3e6; font: 15px system-ui, sans-serif; }
    .label { fill: #a7abb3; font-size: 12px; letter-spacing: .08em; }
    .box { fill: #343a43; stroke: #69717d; stroke-width: 1.5; rx: 8; }
    .accent { fill: #33413f; stroke: #8fc7b5; }
    .arrow { fill: none; stroke: #999fa9; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999fa9"/>
    </marker>
  </defs>
  <text class="label" x="30" y="35">WEBGL — FIXED-FUNCTION BLENDING</text>
  <rect class="box" x="30" y="55" width="210" height="70"/>
  <text x="55" y="86">8,192 point vertices</text>
  <text class="label" x="55" y="108">x, y, 1, 0</text>
  <path class="arrow" d="M240 90 H345"/>
  <rect class="box" x="345" y="55" width="245" height="70"/>
  <text x="370" y="86">ONE + ONE blending</text>
  <text class="label" x="370" y="108">RGBA32F framebuffer</text>
  <path class="arrow" d="M590 90 H695"/>
  <rect class="box accent" x="695" y="55" width="225" height="70"/>
  <text x="720" y="86">1 × 1 result texture</text>
  <text class="label" x="720" y="108">sumX, sumY, count</text>

  <text class="label" x="30" y="190">WEBGPU — COMPUTE WORKGROUP REDUCTION</text>
  <rect class="box" x="30" y="210" width="210" height="70"/>
  <text x="55" y="241">8,192 storage records</text>
  <text class="label" x="55" y="263">float32 × 2</text>
  <path class="arrow" d="M240 245 H345"/>
  <rect class="box" x="345" y="210" width="245" height="70"/>
  <text x="370" y="241">32 workgroup partials</text>
  <text class="label" x="370" y="263">256 invocations each</text>
  <path class="arrow" d="M590 245 H695"/>
  <rect class="box accent" x="695" y="210" width="225" height="70"/>
  <text x="720" y="241">1 storage result</text>
  <text class="label" x="720" y="263">sumX, sumY, count</text>
</svg>
