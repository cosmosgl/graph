name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # This workflow runs PR-controlled code; never leave the GITHUB_TOKEN
      # persisted in .git/config for it to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reads the pnpm version to install from the packageManager field.
      - uses: pnpm/action-setup@v6
      # engines.node in package.json is the single home of the supported Node
      # version; CI verifies on its floor.
      - id: node
        run: echo "floor=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.floor }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish in lockstep; catch version drift early.
      - run: node scripts/check-lockstep.mjs
      - run: pnpm run lint
      # Covers stories and tests too, which the build never compiles, and exits
      # non-zero on its own.
      - run: pnpm run typecheck
      # Production engine/deck browser suite; the research lab runs locally.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      # The build exits 0 even when TypeScript reports errors; the grep turns
      # them into a failure.
      - name: Build
        # Default runner shell is bash -e without pipefail: a hard build
        # crash would exit through tee as 0 and only the grep would judge.
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log
          ! grep -q "error TS" build.log
      - run: pnpm run build:pages
      # Advisories reachable from the published package only; dev-tooling
      # advisories are tracked but must not block unrelated work.
      - name: Runtime dependency audit
        run: pnpm audit --prod --audit-level=high

  webgpu:
    runs-on: ubuntu-latest
    env:
      COSMOS_TEST_SWIFTSHADER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - id: node
        run: echo "floor=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.floor }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-lockstep.mjs
      - run: pnpm --dir experiments/graph-webgpu run lint
      - run: pnpm --dir experiments/graph-webgpu run typecheck
      - run: pnpm exec playwright install --with-deps --no-shell chromium
      - run: pnpm --dir experiments/graph-webgpu test
      - name: Verify the installed Graph and Deck packages
        run: |
          app_dir=$(mktemp -d)
          sh scripts/prepare-packed-webgpu-deck.sh "$app_dir"
          node scripts/check-packed-webgpu-deck.mjs --browser chromium --swiftshader --ci "$app_dir"
