name: CI

on:
  workflow_dispatch:
    inputs:
      investigation:
        description: Software investigation (native-only tests remain skipped)
        type: choice
        options: [arithmetic, point-styling, links, full]
        default: point-styling
      pr_number:
        description: Optional open PR number; test its pinned merge revision
        type: string
        default: ''
      full_sweep:
        description: Enable this investigation's explicit software cost sweeps
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # A skipped manual job must never satisfy the required verify check.
    name: ${{ github.event_name == 'workflow_dispatch' && 'core verification omitted' || 'verify' }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # This workflow runs PR-controlled code; never leave the GITHUB_TOKEN
      # persisted in .git/config for it to read.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reads the pnpm version to install from the packageManager field.
      - uses: pnpm/action-setup@v6
      # engines.node in package.json is the single home of the supported Node
      # version; CI verifies on its floor.
      - id: node
        run: echo "floor=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.floor }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Workspace packages publish in lockstep; catch version drift early.
      - run: node scripts/check-lockstep.mjs
      - run: pnpm run lint
      # Covers stories and tests too, which the build never compiles, and exits
      # non-zero on its own.
      - run: pnpm run typecheck
      # Real-GPU browser suite (headless Chromium on SwiftShader).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter @cosmos.gl/gpu-lab test:ui
      - run: node --test scripts/lab-validation.test.mjs experiments/cosmos-gpu-lab/scripts/artifacts.test.mjs
      # The build exits 0 even when TypeScript reports errors; the grep turns
      # them into a failure.
      - name: Build
        # Default runner shell is bash -e without pipefail: a hard build
        # crash would exit through tee as 0 and only the grep would judge.
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log
          ! grep -q "error TS" build.log
      - run: pnpm run build:pages
      # Advisories reachable from the published package only; dev-tooling
      # advisories are tracked but must not block unrelated work.
      - name: Runtime dependency audit
        run: pnpm audit --prod --audit-level=high

  lab-validation:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAB_INVESTIGATION: ${{ inputs.investigation }}
      LAB_FULL_SWEEP: ${{ inputs.full_sweep }}
    steps:
      - name: Require a repository writer to dispatch
        uses: actions/github-script@v8
        with:
          script: |
            const actors = new Set([context.actor, process.env.GITHUB_TRIGGERING_ACTOR]);
            for (const username of actors) {
              if (!username) throw new Error('Missing dispatch actor');
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username
              });
              if (!['write', 'maintain', 'admin'].includes(data.permission)) {
                throw new Error(`${username} does not have repository write permission`);
              }
            }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve immutable test revision
        id: revision
        env:
          LAB_REVISION_FILE: ${{ runner.temp }}/lab-revision.json
          GH_TOKEN: ${{ github.token }}
          LAB_PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/lab-validation.mjs resolve
      - name: Run investigation in an isolated software container
        env:
          LAB_REVISION_FILE: ${{ runner.temp }}/lab-revision.json
          NODE_FLOOR: ${{ steps.revision.outputs.node_floor }}
          LAB_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          # The selected revision is fetched and executed only inside this container.
          # No host checkout, credentials, cache tokens or Docker socket enter it.
          mkdir -p experiments/cosmos-gpu-lab/captures
          docker run --rm --init \
            --mount "type=bind,src=$PWD/experiments/cosmos-gpu-lab/captures,dst=/work/experiments/cosmos-gpu-lab/captures" \
            --mount "type=bind,src=$LAB_REVISION_FILE,dst=/lab-revision.json,readonly" \
            --workdir /work \
            -e CI=1 -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -e LAB_INVESTIGATION -e LAB_FULL_SWEEP \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_REPOSITORY -e LAB_SHA \
            -e LAB_REVISION_FILE=/lab-revision.json \
            "node:${NODE_FLOOR}-bookworm" sh -ec '
              git init -q .
              git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
              git fetch --no-tags --depth=1 origin "$LAB_SHA"
              git checkout --detach FETCH_HEAD
              test "$(git rev-parse HEAD)" = "$LAB_SHA"
              corepack enable
              pnpm install --frozen-lockfile
              pnpm exec playwright install --with-deps chromium
              node --test scripts/lab-validation.test.mjs experiments/cosmos-gpu-lab/scripts/artifacts.test.mjs
              node scripts/lab-validation.mjs run
            '
      - name: Retain evidence, including failed assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lab-revision.json
            experiments/cosmos-gpu-lab/captures/validation-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
