name: Deploy to GitHub Pages

on:
  push:
    branches:
      - github_pages

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # No later step performs authenticated git operations; don't leave
          # the GITHUB_TOKEN persisted in .git/config.
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Reads the pnpm version to install from the packageManager field.
      - uses: pnpm/action-setup@v6
      # engines.node in package.json is the single home of the supported Node
      # version; deploy builds on its floor, same as ci.yml.
      - id: node
        run: echo "floor=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.floor }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No `--` separator: npm consumed it, pnpm forwards it literally and
      # storybook then treats `-o _site` as positional text and builds to the
      # default directory instead.
      - run: pnpm run build:storybook -o _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
