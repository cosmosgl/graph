<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="980" height="520" fill="#ffffff"/>
<text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600">One simulation tick: every force does swap → force → integrate on its own; collision goes last</text><rect x="20" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="89" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">gravity</text><text x="89" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if enabled</text><text x="89" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="158.0" y1="93.0" x2="178.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="180" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="249" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">center</text><text x="249" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if enabled</text><text x="249" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="318.0" y1="93.0" x2="338.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="340" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="409" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">many-body</text><text x="409" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">always</text><text x="409" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="478.0" y1="93.0" x2="498.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="500" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="569" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">links</text><text x="569" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">incoming, outgoing</text><text x="569" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="638.0" y1="93.0" x2="658.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="660" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="729" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">clusters</text><text x="729" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if clustered</text><text x="729" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="798.0" y1="93.0" x2="818.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="820" y="60" width="138" height="66" rx="9" fill="#fae8cd" stroke="#e9a13b" stroke-width="1.6"/><text x="889" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#e9a13b" text-anchor="middle" font-weight="600">collision</text><text x="889" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if strength > 0</text><text x="889" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><text x="20" y="150" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Attraction (links, clusters) re-creates overlap every tick. Running collision after it corrects that overlap within the same tick;</text><text x="20" y="166" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">before it, the correction would lag a frame and the two would oscillate. Each force reads the positions the previous one just wrote.</text><text x="20" y="208" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#1e293b" text-anchor="start" font-weight="600">Inside the collision force</text><rect x="20" y="232" width="150" height="104" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="95" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">inputs</text><text x="95" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">positions (latest)</text><text x="95" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">resolved sizes</text><text x="95" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">exit status</text><line x1="170.0" y1="284.0" x2="206.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="208" y="232" width="220" height="104" rx="9" fill="#d3ece9" stroke="#2a9d8f" stroke-width="1.6"/><text x="318" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#2a9d8f" text-anchor="middle" font-weight="600">1 · build grid  × 4</text><text x="318" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">point-list draw, additive blend:</text><text x="318" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">[Σx, Σy, Σsize, count] per cell,</text><text x="318" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">one grid per half-cell offset</text><text x="318" y="319" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">absent points culled</text><rect x="452" y="238" width="40" height="40" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.2"/><line x1="462.0" y1="238" x2="462.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="248.0" x2="492" y2="248.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="472.0" y1="238" x2="472.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="258.0" x2="492" y2="258.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="482.0" y1="238" x2="482.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="268.0" x2="492" y2="268.0" stroke="#cbd5e1" stroke-width="0.8"/><rect x="500" y="238" width="40" height="40" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.2"/><line x1="505.0" y1="238" x2="505.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="248.0" x2="540" y2="248.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="515.0" y1="238" x2="515.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="258.0" x2="540" y2="258.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="525.0" y1="238" x2="525.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="268.0" x2="540" y2="268.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="505.0" y1="238" x2="505.0" y2="278" stroke="#cbd5e1" stroke-width="0.8"/><rect x="452" y="286" width="40" height="40" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.2"/><line x1="462.0" y1="286" x2="462.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="291.0" x2="492" y2="291.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="472.0" y1="286" x2="472.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="301.0" x2="492" y2="301.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="482.0" y1="286" x2="482.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="311.0" x2="492" y2="311.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="452" y1="291.0" x2="492" y2="291.0" stroke="#cbd5e1" stroke-width="0.8"/><rect x="500" y="286" width="40" height="40" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.2"/><line x1="505.0" y1="286" x2="505.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="291.0" x2="540" y2="291.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="515.0" y1="286" x2="515.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="301.0" x2="540" y2="301.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="525.0" y1="286" x2="525.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="311.0" x2="540" y2="311.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="505.0" y1="286" x2="505.0" y2="326" stroke="#cbd5e1" stroke-width="0.8"/><line x1="500" y1="291.0" x2="540" y2="291.0" stroke="#cbd5e1" stroke-width="0.8"/><line x1="428.0" y1="284.0" x2="448.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><text x="496" y="350" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">4 grid textures</text><text x="496" y="364" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">(≤ 512², rgba32float)</text><line x1="544.0" y1="284.0" x2="568.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="570" y="232" width="236" height="104" rx="9" fill="#d7e6ff" stroke="#3a86ff" stroke-width="1.6"/><text x="688" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#3a86ff" text-anchor="middle" font-weight="600">2 · force pass  × 4</text><text x="688" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">full-screen, one fragment per point;</text><text x="688" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">reads 9 cells of grid k, pushes off</text><text x="688" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">each cell average (¼ weight), caps;</text><text x="688" y="319" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">adds into the velocity texture</text><line x1="806.0" y1="284.0" x2="830.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="832" y="232" width="128" height="104" rx="9" fill="#fae8cd" stroke="#e9a13b" stroke-width="1.6"/><text x="896" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#e9a13b" text-anchor="middle" font-weight="600">integrate</text><text x="896" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">pos += v · friction</text><text x="896" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">clamp to space</text><text x="896" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">(shared step)</text><path d="M 896 336 L 896 382 L 95 382 L 95 340" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="300" y="377" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">next tick (after the other forces have run again)</text><text x="20" y="420" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">Cost per tick is O(n) with a fixed constant — 4 × n binned vertices, then 4 × n fragments doing 9 grid fetches — and does not</text><text x="20" y="437" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">grow with how crowded a cell is: the cell is one aggregate however many points it holds. Crowding costs quality and ticks to converge, not time.</text><text x="20" y="463" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Memory: 4 grids × grid² × 16 B — 16 MB at the 512² cap, which the default size 4 reaches — plus 16 B per point of sizes; allocated lazily on</text><text x="20" y="480" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">first use, never while strength is 0. The velocity texture is cleared once at the start of the force pass; the four offset passes blend into it</text><text x="20" y="497" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">additively before the single integration.</text>
</svg>