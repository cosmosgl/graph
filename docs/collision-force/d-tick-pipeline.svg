<svg xmlns="http://www.w3.org/2000/svg" width="980" height="528" viewBox="0 0 980 528">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="980" height="528" fill="#ffffff"/>
<text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600">One simulation tick: every force does swap → force → integrate on its own; collision goes last</text><rect x="20" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="89" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">gravity</text><text x="89" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if enabled</text><text x="89" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="158.0" y1="93.0" x2="178.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="180" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="249" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">center</text><text x="249" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if enabled</text><text x="249" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="318.0" y1="93.0" x2="338.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="340" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="409" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">many-body</text><text x="409" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">always</text><text x="409" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="478.0" y1="93.0" x2="498.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="500" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="569" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">links</text><text x="569" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">incoming, outgoing</text><text x="569" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="638.0" y1="93.0" x2="658.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="660" y="60" width="138" height="66" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="729" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">clusters</text><text x="729" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if clustered</text><text x="729" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><line x1="798.0" y1="93.0" x2="818.0" y2="93.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" /><rect x="820" y="60" width="138" height="66" rx="9" fill="#fae8cd" stroke="#e9a13b" stroke-width="1.6"/><text x="889" y="82" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#e9a13b" text-anchor="middle" font-weight="600">collision</text><text x="889" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">if strength > 0</text><text x="889" y="117" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">swap · force · integrate</text><text x="20" y="150" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Attraction (links, clusters) re-creates overlap every tick. Running collision after it corrects that overlap within the same tick;</text><text x="20" y="166" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">before it, the correction would lag a frame and the two would oscillate. Each force reads the positions the previous one just wrote.</text><text x="20" y="208" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" fill="#1e293b" text-anchor="start" font-weight="600">Inside the collision force</text><rect x="20" y="232" width="126" height="104" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="83" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="600">inputs</text><text x="83" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">positions (latest)</text><text x="83" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">resolved sizes</text><text x="83" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">exit status</text><line x1="146.0" y1="284.0" x2="170.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="172" y="232" width="150" height="104" rx="9" fill="#ede4ff" stroke="#7c3aed" stroke-width="1.6"/><text x="247" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600">0 · data bounds</text><text x="247" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">the live points’ box,</text><text x="247" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">reduced on the GPU;</text><text x="247" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">cells are counted</text><text x="247" y="319" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">from its origin</text><line x1="322.0" y1="284.0" x2="348.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="350" y="206" width="430" height="144" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/><text x="362" y="223" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="600">× 4 offset passes in sequence, one reused 1024² grid</text><rect x="362" y="232" width="180" height="104" rx="9" fill="#d3ece9" stroke="#2a9d8f" stroke-width="1.6"/><text x="452" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#2a9d8f" text-anchor="middle" font-weight="600">1 · build grid</text><text x="452" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">point-list draw, additive:</text><text x="452" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">[Σx, Σy, Σsize, count]</text><text x="452" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">per hashed cell; absent and</text><text x="452" y="319" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">non-finite points culled</text><line x1="542.0" y1="284.0" x2="566.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="568" y="232" width="200" height="104" rx="9" fill="#d7e6ff" stroke="#3a86ff" stroke-width="1.6"/><text x="668" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#3a86ff" text-anchor="middle" font-weight="600">2 · force pass</text><text x="668" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">one fragment per point:</text><text x="668" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">reads its 9 hashed cells,</text><text x="668" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">pushes off each average</text><text x="668" y="319" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">(¼ weight) into velocity</text><line x1="780.0" y1="284.0" x2="806.0" y2="284.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="808" y="232" width="152" height="104" rx="9" fill="#fae8cd" stroke="#e9a13b" stroke-width="1.6"/><text x="884" y="254" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#e9a13b" text-anchor="middle" font-weight="600">integrate</text><text x="884" y="274" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">pos += v · friction</text><text x="884" y="289" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">step ≤ spaceSize,</text><text x="884" y="304" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">non-finite dropped</text><text x="884" y="319" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal">(shared step)</text><path d="M 884 336 L 884 402 L 83 402 L 83 340" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/><text x="230" y="397" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal">next tick (after the other forces have run again)</text><text x="20" y="428" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">Cost per tick is O(n) with a fixed constant — the bounds reduction, 4 × n binned vertices, then 4 × n fragments doing 9 grid fetches — and</text><text x="20" y="445" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">does not grow with how crowded a cell is: the cell is one aggregate however many points it holds. Crowding costs quality and ticks to converge, not time.</text><text x="20" y="471" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">Memory: one 1024² rgba32float grid (16 MiB) whatever the point size, the bounds targets (~65 KB) and 16 B per point of sizes; allocated</text><text x="20" y="488" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">lazily on first use, never while strength is 0. The velocity texture is cleared by the first force pass only; the four offset passes blend</text><text x="20" y="505" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal">into it additively before the single integration.</text>
</svg>