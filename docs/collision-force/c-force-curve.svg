293b" text-anchor="start" font-weight="normal">overlap; deeper overlap adds little — the</text><text x="620" y="142" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">push is nearly flat past ~30 %</text><text x="620" y="168" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#e05555" text-anchor="start" font-weight="600">Cap binds at strength ≈ 1</text><text x="620" y="186" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">past 16 % overlap the push is simply 10 % of</text><text x="620" y="202" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">the point’s own radius per pass: overlaps</text><text x="620" y="218" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">resolve by relaxation over a few ticks</text><text x="620" y="244" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="600">Then, per tick</text><text x="620" y="262" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">× 4 offset passes (each ¼-weighted, summed)</text><text x="620" y="278" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">× friction (0.85 default) in the integrator</text><text x="620" y="294" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">so ≤ 0.4 · own radius per tick before friction</text><text x="620" y="320" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="600">Crowds</text><text x="620" y="338" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">a cell’s push is × its population, then the</text><text x="620" y="354" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="start" font-weight="normal">total is damped by 2 / neighbours when > 2</text>
</svg>