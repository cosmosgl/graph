<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="980" height="430" fill="#ffffff"/>
<text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600" >Peeling ping-pong: two slot array textures, each pass rendered into its own layer</text><text x="180" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 0</text><rect x="100" y="110" width="160" height="64" fill="#d7e6ff" stroke="#94a3b8" rx="4"/><text x="180" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >writes even · layer 0</text><text x="180" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >smallest hash / cell</text><line x1="260.0" y1="142.0" x2="316.0" y2="142.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="288" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >winner</text><text x="400" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 1</text><rect x="320" y="110" width="160" height="64" fill="#d3ece9" stroke="#94a3b8" rx="4"/><text x="400" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >reads even 0 · writes odd 0</text><text x="400" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >next-smallest hash</text><line x1="480.0" y1="142.0" x2="536.0" y2="142.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="508" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >winner</text><text x="620" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 2</text><rect x="540" y="110" width="160" height="64" fill="#d7e6ff" stroke="#94a3b8" rx="4"/><text x="620" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >reads odd 0 · writes even 1</text><text x="620" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >next-smallest hash</text><line x1="700.0" y1="142.0" x2="756.0" y2="142.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="728" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >winner</text><text x="840" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 3 … K−1</text><rect x="760" y="110" width="160" height="64" fill="#d3ece9" stroke="#94a3b8" rx="4"/><text x="840" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >reads even 1 · writes odd 1</text><text x="840" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >… alternating</text><rect x="90" y="230" width="840" height="48" fill="none" stroke="#e9a13b" stroke-dasharray="4 3" rx="4"/><text x="96" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e9a13b">slotsEven : sampler2DArray</text><rect x="100" y="238" width="160" height="32" fill="#fae8cd" stroke="#e9a13b" rx="3"/><text x="180" y="259" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 0 = slot 0</text><rect x="540" y="238" width="160" height="32" fill="#fae8cd" stroke="#e9a13b" rx="3"/><text x="620" y="259" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 1 = slot 2</text><rect x="760" y="238" width="20" height="32" fill="#fae8cd" stroke="#e9a13b" rx="3"/><text x="770" y="259" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >…</text><rect x="90" y="300" width="840" height="48" fill="none" stroke="#e9a13b" stroke-dasharray="4 3" rx="4"/><text x="96" y="294" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e9a13b">slotsOdd : sampler2DArray</text><rect x="320" y="308" width="160" height="32" fill="#fae8cd" stroke="#e9a13b" rx="3"/><text x="400" y="329" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 0 = slot 1</text><rect x="760" y="308" width="160" height="32" fill="#fae8cd" stroke="#e9a13b" rx="3"/><text x="840" y="329" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 1 = slot 3</text><rect x="900" y="308" width="20" height="32" fill="#fae8cd" stroke="#e9a13b" rx="3"/><text x="910" y="329" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="normal" >…</text><line x1="180.0" y1="174.0" x2="180.0" y2="236.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><line x1="400.0" y1="174.0" x2="400.0" y2="306.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><line x1="620.0" y1="174.0" x2="620.0" y2="236.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><line x1="840.0" y1="174.0" x2="840.0" y2="306.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><text x="20" y="390" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >Pass k must sample pass k−1's output, and sampling one layer of a texture while rendering to another layer of the same</text><text x="20" y="410" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >texture is a WebGL feedback loop. Alternating between two arrays keeps every pass off the texture it reads — no copy, one shared depth buffer.</text>
</svg>