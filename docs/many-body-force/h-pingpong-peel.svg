<rect width="980" height="430" fill="#ffffff"/>
<text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600" >Peeling ping-pong: two plain 2D targets, copied into array layers</text><text x="180" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 0</text><rect x="100" y="110" width="160" height="64" fill="#d7e6ff" stroke="#94a3b8" rx="4"/><text x="180" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >writes target A</text><text x="180" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >smallest hash / cell</text><line x1="260.0" y1="142.0" x2="316.0" y2="142.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="288" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >winner</text><line x1="180.0" y1="174.0" x2="180.0" y2="266.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><rect x="100" y="270" width="160" height="48" fill="#fae8cd" stroke="#e9a13b" rx="4"/><text x="180" y="298" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 0</text><text x="400" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 1</text><rect x="320" y="110" width="160" height="64" fill="#d3ece9" stroke="#94a3b8" rx="4"/><text x="400" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >reads A · writes B</text><text x="400" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >next-smallest hash</text><line x1="480.0" y1="142.0" x2="536.0" y2="142.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="508" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >winner</text><line x1="400.0" y1="174.0" x2="400.0" y2="266.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><rect x="320" y="270" width="160" height="48" fill="#fae8cd" stroke="#e9a13b" rx="4"/><text x="400" y="298" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 1</text><text x="620" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 2</text><rect x="540" y="110" width="160" height="64" fill="#d7e6ff" stroke="#94a3b8" rx="4"/><text x="620" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >reads B · writes A</text><text x="620" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >next-smallest hash</text><line x1="700.0" y1="142.0" x2="756.0" y2="142.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="728" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >winner</text><line x1="620.0" y1="174.0" x2="620.0" y2="266.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><rect x="540" y="270" width="160" height="48" fill="#fae8cd" stroke="#e9a13b" rx="4"/><text x="620" y="298" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 2</text><text x="840" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" >pass 3 … K−1</text><rect x="760" y="110" width="160" height="64" fill="#d3ece9" stroke="#94a3b8" rx="4"/><text x="840" y="136" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >reads A · writes B</text><text x="840" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" >… alternating</text><line x1="840.0" y1="174.0" x2="840.0" y2="266.0" stroke="#e9a13b" stroke-width="2" marker-end="url(#arr)" /><rect x="760" y="270" width="160" height="48" fill="#fae8cd" stroke="#e9a13b" rx="4"/><text x="840" y="298" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >layer 3 … K−1</text><text x="510" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#b97a1e" text-anchor="middle">copyTextureToTexture</text><line x1="90" y1="330" x2="930" y2="330" stroke="#94a3b8" stroke-width="1"/><text x="510" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e293b" text-anchor="middle">slotsTexture : sampler2DArray — the force pass loops s = 0 … slotCount−1</text><text x="20" y="390" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >Why not render into layer k directly? Pass k must sample pass k−1's output — and sampling one layer of a texture while</text><text x="20" y="410" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >rendering to another layer of the same texture is a WebGL feedback loop. So passes render to plain 2D targets instead.</text>
</svg>