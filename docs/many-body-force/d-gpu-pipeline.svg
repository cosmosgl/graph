<svg xmlns="http://www.w3.org/2000/svg" width="980" height="372" viewBox="0 0 980 372">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="980" height="372" fill="#ffffff"/>
<text x="20" y="40" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600" >One simulation tick of the repulsion force (all on the GPU)</text><rect x="20" y="96" width="118" height="110" rx="9" fill="#f6f8fb" stroke="#94a3b8" stroke-width="1.6"/><text x="79" y="120" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#94a3b8" text-anchor="middle" font-weight="600" >positions</text><text x="79" y="142" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >one texel</text><text x="79" y="159" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >per point (x, y)</text><line x1="138.0" y1="151.0" x2="164.0" y2="151.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="166" y="96" width="178" height="110" rx="9" fill="#f3eeff" stroke="#7c3aed" stroke-width="1.6"/><text x="255" y="120" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="600" >0 · data bounds</text><text x="255" y="142" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >live points → one texel:</text><text x="255" y="159" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >[origin, extent, 1/extent],</text><text x="255" y="176" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >padded + shifted each tick</text><line x1="344.0" y1="151.0" x2="370.0" y2="151.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="372" y="96" width="178" height="110" rx="9" fill="#d3ece9" stroke="#2a9d8f" stroke-width="1.6"/><text x="461" y="120" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#2a9d8f" text-anchor="middle" font-weight="600" >1 · aggregate levels</text><text x="461" y="142" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >draw n points into each</text><text x="461" y="159" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >level over that square:</text><text x="461" y="176" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >[Σx, Σy, count] per cell</text><line x1="550.0" y1="151.0" x2="576.0" y2="151.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="578" y="96" width="178" height="110" rx="9" fill="#d7e6ff" stroke="#3a86ff" stroke-width="1.6"/><text x="667" y="120" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#3a86ff" text-anchor="middle" font-weight="600" >2 · near-field slots</text><text x="667" y="142" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >K depth-peel passes over</text><text x="667" y="159" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >the finest grid: a fresh</text><text x="667" y="176" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >random K-subset per cell</text><line x1="756.0" y1="151.0" x2="782.0" y2="151.0" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arr)" /><rect x="784" y="96" width="178" height="110" rx="9" fill="#fae8cd" stroke="#e9a13b" stroke-width="1.6"/><text x="873" y="120" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13.5" fill="#e9a13b" text-anchor="middle" font-weight="600" >3 · force passes</text><text x="873" y="142" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >levels: centroid repulsion</text><text x="873" y="159" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >+ near field: weighted</text><text x="873" y="176" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="normal" >pairs → velocity texture</text><path d="M 255 206 L 255 232 L 873 232" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="461.0" y1="232.0" x2="461.0" y2="209.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="5 4"/><line x1="667.0" y1="232.0" x2="667.0" y2="209.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="5 4"/><line x1="873.0" y1="232.0" x2="873.0" y2="209.0" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="265" y="250" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="normal" >the texel every pass bins with — one shared, division-free gridCell() (grid-cell.ts)</text><text x="20" y="300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" >The integration step (velocity → positions) is shared with all other forces: it bounds a step’s length, not the position it lands on.</text><text x="20" y="322" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" >Levels: 8², 16², … up to ≈ 2·√n per axis (capped 512²), all over the data box. Slot arrays: K = 2…64 layers × finest grid, [point index, hash] each.</text><text x="20" y="344" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5" fill="#64748b" text-anchor="start" font-weight="normal" >Graphs of ≤ 4,096 points skip all four stages: a single exact all-pairs pass writes the velocity texture directly.</text>
</svg>