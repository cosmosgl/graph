<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="980" height="330" fill="#ffffff"/>
<text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600" >Two paths — the point count picks one</text><rect x="20" y="130" width="110" height="52" fill="#f6f8fb" stroke="#94a3b8" rx="4"/><text x="75" y="152" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >graph of</text><text x="75" y="170" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >n points</text><polygon points="240,116 320,156 240,196 160,156" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/><text x="240" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e293b" text-anchor="middle">n ≤ 4096</text><text x="240" y="168" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >usesAllPairs</text><line x1="130.0" y1="156.0" x2="156.0" y2="156.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><line x1="266.0" y1="129.0" x2="352.0" y2="94.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="300" y="96" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" >no</text><rect x="358" y="60" width="160" height="56" fill="#f6f8fb" stroke="#94a3b8" rx="4"/><text x="438" y="84" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >aggregate the</text><text x="438" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >grid pyramid</text><line x1="518.0" y1="88.0" x2="552.0" y2="88.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><rect x="556" y="60" width="160" height="56" fill="#d7e6ff" stroke="#94a3b8" rx="4"/><text x="636" y="84" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >depth-peel K slots</text><text x="636" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >per finest cell</text><text x="636" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748b" text-anchor="middle">K = 32 (≤16k) · 16 (≤65k) · 8 above</text><line x1="716.0" y1="88.0" x2="750.0" y2="88.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><rect x="754" y="60" width="200" height="56" fill="#f6f8fb" stroke="#94a3b8" rx="4"/><text x="854" y="84" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >far field per level +</text><text x="854" y="102" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >sampled near field ×m/K</text><line x1="266.0" y1="183.0" x2="424.0" y2="234.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="318" y="226" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" >yes</text><rect x="430" y="216" width="250" height="64" fill="#fae8cd" stroke="#e9a13b" rx="4"/><text x="555" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e293b" text-anchor="middle">force-allpairs.frag</text><text x="555" y="262" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >one exact O(n²) pass — no grid, no sampling</text><rect x="850" y="200" width="110" height="52" fill="#d3ece9" stroke="#94a3b8" rx="4"/><text x="905" y="222" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >velocity</text><text x="905" y="240" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="normal" >texture</text><line x1="854.0" y1="116.0" x2="887.0" y2="196.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="892" y="156" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal" >additive</text><line x1="680.0" y1="242.0" x2="846.0" y2="230.0" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)" /><text x="742" y="222" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="normal" >single write</text><text x="20" y="312" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" >Same pairwise falloff and coincident-point kick on both paths — the small-graph path just computes every pair instead of estimating.</text>
</svg>