<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
  </marker>
</defs>
<rect width="980" height="430" fill="#ffffff"/>
<text x="20" y="34" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" fill="#1e293b" text-anchor="start" font-weight="600" >Same cell, same positions — a fresh sample every tick</text><text x="30" y="66" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal" >tick t — sample A (amber)</text><rect x="30" y="76" width="200" height="200" fill="#f6f8fb" stroke="#cbd5e1"/><circle cx="120" cy="116" r="4" fill="#cbd5e1"/><circle cx="180" cy="146" r="4" fill="#cbd5e1"/><circle cx="75" cy="161" r="4" fill="#cbd5e1"/><circle cx="165" cy="166" r="4" fill="#cbd5e1"/><circle cx="85" cy="191" r="4" fill="#cbd5e1"/><circle cx="175" cy="196" r="4" fill="#cbd5e1"/><circle cx="130" cy="211" r="4" fill="#cbd5e1"/><circle cx="190" cy="226" r="4" fill="#cbd5e1"/><circle cx="120" cy="251" r="4" fill="#cbd5e1"/><circle cx="90" cy="126" r="5" fill="#e9a13b"/><circle cx="150" cy="131" r="5" fill="#e9a13b"/><circle cx="105" cy="156" r="5" fill="#e9a13b"/><circle cx="195" cy="176" r="5" fill="#e9a13b"/><circle cx="145" cy="181" r="5" fill="#e9a13b"/><circle cx="100" cy="216" r="5" fill="#e9a13b"/><circle cx="160" cy="221" r="5" fill="#e9a13b"/><circle cx="150" cy="241" r="5" fill="#e9a13b"/><circle cx="135" cy="151" r="6.5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/><line x1="135.0" y1="151.0" x2="98.0" y2="108.0" stroke="#e9a13b" stroke-width="2.5" marker-end="url(#arr)" /><text x="30" y="300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" >force on ⊙ = Σ over sample A × m/K</text><text x="360" y="66" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal" >tick t+1 — sample B (teal)</text><rect x="360" y="76" width="200" height="200" fill="#f6f8fb" stroke="#cbd5e1"/><circle cx="420" cy="126" r="4" fill="#cbd5e1"/><circle cx="480" cy="131" r="4" fill="#cbd5e1"/><circle cx="435" cy="156" r="4" fill="#cbd5e1"/><circle cx="525" cy="176" r="4" fill="#cbd5e1"/><circle cx="475" cy="181" r="4" fill="#cbd5e1"/><circle cx="430" cy="216" r="4" fill="#cbd5e1"/><circle cx="490" cy="221" r="4" fill="#cbd5e1"/><circle cx="480" cy="241" r="4" fill="#cbd5e1"/><circle cx="450" cy="251" r="4" fill="#cbd5e1"/><circle cx="450" cy="116" r="5" fill="#2a9d8f"/><circle cx="510" cy="146" r="5" fill="#2a9d8f"/><circle cx="405" cy="161" r="5" fill="#2a9d8f"/><circle cx="495" cy="166" r="5" fill="#2a9d8f"/><circle cx="415" cy="191" r="5" fill="#2a9d8f"/><circle cx="505" cy="196" r="5" fill="#2a9d8f"/><circle cx="460" cy="211" r="5" fill="#2a9d8f"/><circle cx="520" cy="226" r="5" fill="#2a9d8f"/><circle cx="465" cy="151" r="6.5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/><line x1="465.0" y1="151.0" x2="504.0" y2="192.0" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arr)" /><text x="360" y="300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" >same positions, different draw → different answer</text><text x="690" y="66" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="normal" >the point, tick after tick</text><rect x="690" y="76" width="200" height="200" fill="#f6f8fb" stroke="#cbd5e1"/><polyline points="710,240 726,228 718,210 736,202 748,216 764,208 758,190 774,178 790,188 784,206 800,216 816,206 810,188 826,176 842,184" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr)"/><circle cx="710" cy="240" r="3.5" fill="#1e293b"/><text x="690" y="300" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="start" font-weight="normal" >≈0.5 units/tick, ~92° mean turn — at equilibrium</text><text x="20" y="345" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >The estimate is unbiased — averaged over ticks it equals the exact force — but each tick draws a fresh K-subset and</text><text x="20" y="365" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >weights it by m/K. While the cell stays dense (m ≫ K) that per-tick difference never shrinks: the noise is not annealing,</text><text x="20" y="385" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#1e293b" text-anchor="start" font-weight="normal" >it is a permanent random walk stacked on a settled layout.</text>
</svg>